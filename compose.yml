services:
  api:
    build:
      context: ./backend
    container_name: backend-api
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: redis-cache
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    build:
      context: ./nginx
    container_name: nginx-proxy
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  redis-data: